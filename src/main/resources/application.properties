spring.application.name=platform-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/platform_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=ProductServiceHikariPool

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.exchange=${RABBITMQ_EXCHANGE:order.exchange}
rabbitmq.queue.order-created=${RABBITMQ_ORDER_CREATED_QUEUE:order.created.queue}
rabbitmq.routing-key.order-created=${RABBITMQ_ORDER_CREATED_ROUTING_KEY:order.created}

spring.cache.type=caffeine
spring.cache.cache-names=products,categories,product-by-id
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=500

server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.loggers.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_CLIENT_ID}
springdoc.swagger-ui.oauth.client-secret=${KEYCLOAK_CLIENT_SECRET}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.root=INFO
logging.level.com.onlinestore.productservice=${LOG_LEVEL:INFO}
logging.level.com.onlinestore.userservice=${LOG_LEVEL:INFO}
logging.level.com.onlinestore.orderservice=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n

# Require broker confirmation and detect unroutable order messages.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.jpa.open-in-view=false
