# Development profile overrides
# Required env vars for local dev:
# DB_URL=jdbc:postgresql://localhost:5432/product_db
# DB_USERNAME=postgres
# DB_PASSWORD=postgres
# JWT_ISSUER_URI=http://localhost:8080/realms/online-store
# KEYCLOAK_AUTH_SERVER_URL=http://localhost:8080
# KEYCLOAK_REALM=online-store
# KEYCLOAK_CLIENT_ID=online-store-frontend
# KEYCLOAK_CLIENT_SECRET=
# KEYCLOAK_TOKEN_URI=http://localhost:8080/realms/online-store/protocol/openid-connect/token
# CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=100

logging.level.com.onlinestore.productservice=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
