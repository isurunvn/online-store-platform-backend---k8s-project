spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/platform_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.exchange=${RABBITMQ_EXCHANGE:order.exchange}
rabbitmq.queue.order-created=${RABBITMQ_ORDER_CREATED_QUEUE:order.created.queue}
rabbitmq.routing-key.order-created=${RABBITMQ_ORDER_CREATED_ROUTING_KEY:order.created}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://keycloak:8080/realms/online-store}

springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_CLIENT_ID:online-store-frontend}
springdoc.swagger-ui.oauth.client-secret=${KEYCLOAK_CLIENT_SECRET:}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:online-store}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:online-store-frontend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/online-store/protocol/openid-connect/token}

logging.level.com.onlinestore.productservice=INFO
logging.level.root=INFO
